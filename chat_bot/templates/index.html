<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Word ChatBot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>One-Word AI Assistant</h2>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Hello! Ask me anything, but I will only reply with one word.</div>
        </div>

        <form id="chatForm" class="input-container">
            <input type="text" id="userInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // Store the session ID generated by FastAPI
        const sessionId = "{{ session_id }}";
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Append User Message to UI
            appendMessage(text, 'user-message');
            userInput.value = '';

            // 2. Send request to FastAPI backend
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await response.json();
                
                // 3. Append Bot Message to UI
                if(data.response) {
                    appendMessage(data.response, 'bot-message');
                } else {
                    appendMessage("Error: " + data.error, 'bot-message');
                }
            } catch (error) {
                appendMessage("Failed to connect to backend.", 'bot-message');
            }
        });


        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        }
    </script>
</body>
</html>
