<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Chat Space</title>
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #171717;
            --text-color: #ececec;
            --input-bg: #2f2f2f;
            --user-msg-bg: #2f2f2f;
            --bot-msg-bg: transparent;
            --border-color: #424242;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar similar to ChatGPT */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2a2a2a;
        }

        /* Main Window Layout */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .messages-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .message-row {
            width: 100%;
            display: flex;
            padding: 24px 20%;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .message-row.user {
            background-color: var(--bg-color);
        }

        .message-row.bot {
            background-color: #212121;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #543a3a;
        }

        .bot .avatar {
            background-color: #10a37f;
            color: white;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
            padding-top: 2px;
        }

        /* Fixed Footer Input styling */
        .input-area {
            padding: 20px 20%;
            background-color: var(--bg-color);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            background-color: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        #user-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 200px;
            padding-right: 40px;
        }

        #send-btn {
            position: absolute;
            right: 12px;
            bottom: 10px;
            background-color: #676767;
            color: #212121;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn.active {
            background-color: white;
            color: black;
        }

        /* Processing indicator dot sequence */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #8e8e93;
            border-radius: 50%;
            margin-right: 4px;
            animation: bounce 1.3s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Responsive spacing adjustment */
        @media (max-width: 768px) {
            .message-row, .input-area { padding-left: 5%; padding-right: 5%; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Left navigation section -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ New chat</button>
    </div>

    <!-- Main Chat Workspace -->
    <div class="chat-container">
        <div class="chat-header">LangGraph Gemini Engine</div>
        
        <div class="messages-box" id="messages-box">
            <!-- Dynamic context loads here -->
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" rows="1" placeholder="Message LangGraph Chatbot..." oninput="toggleButton()"></textarea>
                <button id="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        // Track unique active thread session strings
        let currentThreadId = "session_" + Math.random().toString(36).substring(2, 9);
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const messagesBox = document.getElementById("messages-box");

        // Submit action triggers via standard carriage return
        inputField.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function toggleButton() {
            if (inputField.value.trim().length > 0) {
                sendBtn.classList.add("active");
            } else {
                sendBtn.classList.remove("active");
            }
        }

        function createNewChat() {
            messagesBox.innerHTML = "";
            currentThreadId = "session_" + Math.random().toString(36).substring(2, 9);
        }

        function appendMessage(sender, text) {
            const row = document.createElement("div");
            row.classList.add("message-row", sender);

            const avatar = document.createElement("div");
            avatar.classList.add("avatar");
            avatar.innerText = sender === "user" ? "U" : "AI";

            const content = document.createElement("div");
            content.classList.add("message-content");
            content.innerText = text;

            row.appendChild(avatar);
            row.appendChild(content);
            messagesBox.appendChild(row);
            messagesBox.scrollTop = messagesBox.scrollHeight;
            return row;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // Render text UI immediately 
            appendMessage("user", text);
            inputField.value = "";
            inputField.rows = 1;
            toggleButton();

            // Append loading animation node
            const loaderRow = document.createElement("div");
            loaderRow.classList.add("message-row", "bot");
            loaderRow.innerHTML = `<div class="avatar">AI</div><div class="message-content typing-indicator"><span></span><span></span><span></span></div>`;
            messagesBox.appendChild(loaderRow);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, thread_id: currentThreadId })
                });
                
                const data = await response.json();
                loaderRow.remove(); // Clear processing animation

                if (response.ok) {
                    appendMessage("bot", data.reply);
                } else {
                    appendMessage("bot", "Error structural exception: " + data.detail);
                }
            } catch (err) {
                loaderRow.remove();
                appendMessage("bot", "Network layer transmission broken.");
            }
        }
    </script>
</body>
</html>
